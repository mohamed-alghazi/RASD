# Reference configuration only; adding this file does not deploy or provision a service.
services:
  - type: web
    name: rasd-v2
    runtime: node
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/rasd
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
